<!DOCTYPE html>
<html>
<head>
    <title>Mineral Forecasting</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-4">

<h3>🔮 Mineral Forecasting</h3>

<form method="POST" class="row g-3">

    <div class="col-md-3">
        <label>Mineral</label>
        <select name="mineral" class="form-select" required>
            <option value="lithium">Lithium</option>
            <option value="copper">Copper</option>
            <option value="graphite">Graphite</option>
        </select>
    </div>

    <div class="col-md-3">
        <label>Trade</label>
        <select name="trade" class="form-select" required>
            <option value="export">Export</option>
            <option value="import">Import</option>
        </select>
    </div>

    <div class="col-md-3">
        <label>Metric</label>
        <select name="metric" class="form-select" required>
            <option value="quantity">Quantity</option>
            <option value="cost">Cost</option>
        </select>
    </div>

    <div class="col-md-3">
        <label>Start Year</label>
        <input type="number" name="year" class="form-control" value="2024" required>
    </div>

    <div class="col-md-3">
        <label>Start Month</label>
        <select name="start_month" class="form-select" required>
            <option value="1">January</option>
            <option value="2">February</option>
            <option value="3">March</option>
            <option value="4">April</option>
            <option value="5">May</option>
            <option value="6">June</option>
            <option value="7">July</option>
            <option value="8">August</option>
            <option value="9">September</option>
            <option value="10">October</option>
            <option value="11">November</option>
            <option value="12">December</option>
        </select>
    </div>

    <div class="col-md-3">
        <label>Months to Predict</label>
        <input type="number" name="months" class="form-control" value="12" required>
    </div>

    <div class="col-md-12">
        <button class="btn btn-primary">Predict</button>
    </div>

</form>

{% if error %}
<div class="alert alert-danger mt-3">{{ error }}</div>
{% endif %}

{% if result %}
<hr>
<h4>📈 Predicted Values</h4>

<table class="table table-bordered">
  <thead>
    <tr>
      <th>Year</th>
      <th>Month</th>
      <th>Predicted Value</th>
    </tr>
  </thead>
  <tbody>
    {% for r in result %}
    <tr>
      <td>{{ r.year }}</td>
      <td>{{ r.month }}</td>
      <td>{{ r.predicted }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endif %}

</body>
</html>
